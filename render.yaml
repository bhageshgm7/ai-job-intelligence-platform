databases:
  - name: job-intelligence-db
    databaseName: job_intelligence_db
    user: job_intel_user
    plan: free

services:
  # Backend Django REST Web Service
  - type: web
    name: ai-job-intelligence-backend
    runtime: python
    plan: free
    buildCommand: "pip install -r backend/requirements.txt && python backend/manage.py collectstatic --noinput && python backend/manage.py migrate"
    startCommand: "gunicorn config.wsgi:application --chdir backend --bind 0.0.0.0:$PORT"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: DEBUG
        value: "False"
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: job-intelligence-db
          property: connectionString
      - key: ALLOWED_HOSTS
        value: "localhost,127.0.0.1,.onrender.com"
      - key: CORS_ALLOWED_ORIGINS
        value: "http://localhost:5173,http://127.0.0.1:5173"
      - key: OLLAMA_BASE_URL
        value: ""
      - key: OLLAMA_MODEL
        value: "llama3.2:latest"

  # Frontend React / Vite Static Site
  - type: static
    name: ai-job-intelligence-frontend
    buildCommand: "npm install && npm run build"
    staticPublishPath: "./dist"
    rootDir: "./frontend"
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        # Set to your live backend URL + /api (e.g. https://<YOUR-BACKEND-SLUG>.onrender.com/api)
        # Update this in the Render Dashboard Environment tab after backend creation.
        value: "https://<YOUR-BACKEND-SLUG>.onrender.com/api"
