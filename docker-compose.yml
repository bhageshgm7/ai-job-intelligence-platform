version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: job_intel_db
    environment:
      POSTGRES_DB: job_intelligence_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build:
      context: ./backend
    container_name: job_intel_backend
    command: >
      sh -c "python manage.py migrate &&
             python manage.py runserver 0.0.0.0:8000"
    volumes:
      - ./backend:/app
      - ./media:/media
    ports:
      - "8000:8000"
    environment:
      - DEBUG=True
      - SECRET_KEY=django-insecure-production-docker-secret-key-123456789
      - DB_ENGINE=postgresql
      - DATABASE_NAME=job_intelligence_db
      - DATABASE_USER=postgres
      - DATABASE_PASSWORD=postgrespassword
      - DATABASE_HOST=db
      - DATABASE_PORT=5432
      - OLLAMA_BASE_URL=http://host.docker.internal:11434
      - OLLAMA_MODEL=llama3.2:latest
    depends_on:
      - db

  frontend:
    build:
      context: ./frontend
    container_name: job_intel_frontend
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      - VITE_API_URL=/api
    depends_on:
      - backend

volumes:
  postgres_data:
